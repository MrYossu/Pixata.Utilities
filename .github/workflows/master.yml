# ***************** TESTS **************** #

# IMPORTANT - ALL PROJECTS SHOULD BE RESTORED (and built) BEFORE USING dotnet tests
# The test projects are named rather than running against the whole solution, so the unmaintained
# Pixata.Functional (still in the .sln) isn't built.
# The credentials are here too, as this restores the test projects. If any project hasn't been
# restored above, NuGet asks the Telerik feed about its packages, and an unauthenticated feed answers
# 401 rather than 404, which is a hard NU1301 failure rather than a skipped source.
    - name: Run Tests - Pixata.Extensions.Tests
      run: dotnet test Pixata.Extensions.Tests/Pixata.Extensions.Tests.csproj --verbosity normal
      env:
        TELERIK_USERNAME: ${{secrets.MYTELERIKACCOUNTUSERNAME}}
        TELERIK_PASSWORD: ${{secrets.MYTELERIKACCOUNTPASSWORD}}

    - name: Run Tests - Pixata.Blazor.Tests
      run: dotnet test Pixata.Blazor.Tests/Pixata.Blazor.Tests.csproj --verbosity normal
      env:
        TELERIK_USERNAME: ${{secrets.MYTELERIKACCOUNTUSERNAME}}
        TELERIK_PASSWORD: ${{secrets.MYTELERIKACCOUNTPASSWORD}}

    - name: Run Tests - Pixata.SimilarityChooser.Tests
      run: dotnet test Pixata.SimilarityChooser.Tests/Pixata.SimilarityChooser.Tests.csproj --verbosity normal
      env:
        TELERIK_USERNAME: ${{secrets.MYTELERIKACCOUNTUSERNAME}}
        TELERIK_PASSWORD: ${{secrets.MYTELERIKACCOUNTPASSWORD}}

