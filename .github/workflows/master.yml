name: master

on:  
  push:  
    branches: [ master ]

jobs:  
  build_pixata: 
    runs-on: windows-latest  
    steps:  
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Warns (without failing the build) about any package whose code has changed since its current version was published, so the
    # version can be bumped before the release workflow refuses to publish
    - name: Check that changed packages have new versions
      run: python .github/scripts/check-package-versions.py --warn-only

    - name: Setup .NET Core 2.1
      uses: actions/setup-dotnet@v4 
      with:  
        dotnet-version: '2.1.x'
    - name: Setup .NET Core 7
      uses: actions/setup-dotnet@v4
      with:  
        dotnet-version: '7.0'
    - name: Setup .NET Core 8
      uses: actions/setup-dotnet@v4
      with:  
        dotnet-version: '8.0'
    
# ***************** BUILDS **************** #

    # Pixata.Blazor
    - name: Restore - Pixata.Blazor Dependencies
      run: dotnet restore Pixata.Blazor/Pixata.Blazor.csproj  --configfile ./nuget.config
      env:
        TELERIK_USERNAME: ${{secrets.MYTELERIKACCOUNTUSERNAME}}
        TELERIK_PASSWORD: ${{secrets.MYTELERIKACCOUNTPASSWORD}}
    
    - name: Build - Pixata.Blazor.csproj
      run: dotnet build Pixata.Blazor/Pixata.Blazor.csproj  --configuration Release --configfile ./nuget.config
